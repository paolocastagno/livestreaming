user root;
worker_processes auto;
pid /run/nginx-client.pid;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/client-access.log;
    error_log /var/log/nginx/client-error.log info;

    server {
        listen 8088;
        server_name _;

        # Connections enter through Docker's bridge, then nginx opens the
        # upstream connection from the emulated client LAN. The response and
        # every media segment therefore traverse home, ISP, and CDN nodes.
        location / {
            proxy_pass http://10.0.3.2;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
