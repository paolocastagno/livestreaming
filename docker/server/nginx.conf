include /etc/nginx/modules-enabled/*.conf;

user root;
worker_processes 1;
pid /run/nginx.pid;
rtmp_auto_push on;
rtmp_auto_push_reconnect 1s;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Six keyframe-aligned contribution renditions arrive from the encoder
        # node and are consumed by the HLS and DASH origin packagers.
        application ingest {
            live on;
            record off;
            wait_key on;
            # Start audio together with the first video keyframe so the shared
            # audio timeline begins on the same four-second GOP grid as video.
            wait_video on;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    map $request_uri $live_cache_control {
        default "no-cache, no-store, must-revalidate";
    }

    server {
        listen 80 default_server;
        server_name _;
        root /srv/www;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /readyz {
            root /srv/stream;
            try_files /hls/master.m3u8 =503;
        }

        location /status {
            rtmp_stat all;
        }

        location /hls/ {
            alias /srv/stream/hls/;
            add_header Cache-Control $live_cache_control always;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp4 m4s mp4;
            }
        }

        location /dash/ {
            alias /srv/stream/dash/;
            add_header Cache-Control $live_cache_control always;
            types {
                application/dash+xml mpd;
                video/mp4 m4s mp4;
            }
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
