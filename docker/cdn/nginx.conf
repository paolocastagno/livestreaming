user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:20m
                     max_size=2g inactive=15m use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m
                     max_size=128m inactive=1h use_temp_path=off;

    upstream origin {
        server 10.0.4.2:80;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range,X-Cache-Status,X-Edge" always;
        add_header X-Edge "kathara-cdn" always;

        location = /edge-healthz {
            access_log off;
            default_type text/plain;
            return 200 "edge ok\n";
        }

        location = /origin-healthz {
            proxy_pass http://origin/healthz;
            proxy_set_header Host origin;
        }

        # Live manifests must be refreshed; caching them would extend latency
        # and can expose segments that have already left the origin window.
        location ~* \.(m3u8|mpd)$ {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host origin;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Cache-Status "BYPASS" always;
        }

        # CMAF init/media objects are immutable and shared across viewers.
        location ~* \.(m4s|mp4)$ {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host origin;
            proxy_cache media;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_valid 200 206 15m;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_force_ranges on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie;
            add_header Cache-Control "public, max-age=900, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Cache the player application separately from live media.
        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host origin;
            proxy_cache static;
            proxy_cache_valid 200 1h;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
