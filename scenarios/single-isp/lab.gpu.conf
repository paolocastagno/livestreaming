LAB_NAME="adaptive-streaming-single-isp-gpu"
LAB_DESCRIPTION="GPU live ABR streaming through a CDN edge and one ISP"
LAB_VERSION="3.0"
LAB_AUTHOR="livestreaming lab"
LAB_WEB="https://www.kathara.org/"

# RTX 4000 SFF Ada live encoder: one 4K decode, six CUDA scales, and six
# simultaneous NVENC H.264 outputs. CPUs 16-23 are the i9-13900 E-core group.
source[0]="CONTRIBUTION"
source[image]="livestreaming/source-gpu:local"
source[mem]="8g"
source[cpus]="8"
# source[cpuset_cpus]="16-23"
# source[cpuset_mems]="0"
source[gpus]="0"
source[env]="NVIDIA_VISIBLE_DEVICES=0"
source[env]="NVIDIA_DRIVER_CAPABILITIES=compute,video,utility"

# Two P-cores (both SMT siblings) for ingest plus the HLS and DASH packagers.
server[0]="CONTRIBUTION"
server[1]="ORIGIN"
server[image]="livestreaming/server:local"
server[bridged]="true"
server[port]="8080:80/tcp"
server[mem]="4g"
server[cpus]="2"
# server[cpuset_cpus]="12-15"
# server[cpuset_mems]="0"

# Two P-cores are available to the cache, with a one-CPU quota for isolation.
cdn[0]="ORIGIN"
cdn[1]="BACKBONE"
cdn[image]="livestreaming/cdn:local"
cdn[bridged]="true"
cdn[port]="8081:80/tcp"
cdn[mem]="2g"
cdn[cpus]="1"
# cdn[cpuset_cpus]="8-11"
# cdn[cpuset_mems]="0"

isp[0]="BACKBONE"
isp[1]="ACCESS"
isp[image]="kathara/core:latest"
isp[privileged]="true"
isp[mem]="512m"
isp[cpus]="1"
# isp[cpuset_cpus]="4-5"
# isp[cpuset_mems]="0"

home[0]="ACCESS"
home[1]="HOME"
home[image]="kathara/core:latest"
home[privileged]="true"
home[mem]="512m"
home[cpus]="1"
# home[cpuset_cpus]="6-7"
# home[cpuset_mems]="0"

client[0]="HOME"
client[image]="livestreaming/client:local"
client[bridged]="true"
client[port]="6080:6080/tcp"
client[port]="8088:8088/tcp"
client[mem]="4g"
client[cpus]="2"
# client[cpuset_cpus]="24-27"
# client[cpuset_mems]="0"

background[0]="HOME"
background[image]="livestreaming/traffic:local"
background[mem]="512m"
background[cpus]="0.5"
# background[cpuset_cpus]="28-29"
# background[cpuset_mems]="0"
