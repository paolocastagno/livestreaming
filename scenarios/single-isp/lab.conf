LAB_NAME="adaptive-streaming-single-isp"
LAB_DESCRIPTION="Live ABR streaming from one content provider through a CDN edge and one ISP"
LAB_VERSION="3.0"
LAB_AUTHOR="livestreaming lab"
LAB_WEB="https://www.kathara.org/"

# Pre-encoded, keyframe-aligned renditions are published as live RTMP
# contribution feeds. This models an encoder without real-time 4K CPU cost.
source[0]="CONTRIBUTION"
source[image]="livestreaming/source:local"
source[mem]="1g"
source[cpus]="1"

# Origin ingest and live HLS/DASH packager.
server[0]="CONTRIBUTION"
server[1]="ORIGIN"
server[image]="livestreaming/server:local"
server[bridged]="true"
server[port]="8080:80/tcp"
server[mem]="2g"
server[cpus]="2"

# Pull-through CDN edge cache. Clients never fetch media directly from origin.
cdn[0]="ORIGIN"
cdn[1]="BACKBONE"
cdn[image]="livestreaming/cdn:local"
cdn[bridged]="true"
cdn[port]="8081:80/tcp"
cdn[mem]="1g"
cdn[cpus]="1"

# Provider/core hop between the CDN point of presence and access network.
isp[0]="BACKBONE"
isp[1]="ACCESS"
isp[image]="kathara/core:latest"
isp[privileged]="true"

# Residential gateway. Upload shaping is applied on its WAN egress.
home[0]="ACCESS"
home[1]="HOME"
home[image]="kathara/core:latest"
home[privileged]="true"

# End-user browser. Host port 8088 reverse-proxies from this device so the
# host/LAN browser's media requests still cross the emulated path.
client[0]="HOME"
client[image]="livestreaming/client:local"
client[bridged]="true"
client[port]="6080:6080/tcp"
client[port]="8088:8088/tcp"
client[mem]="2g"
client[cpus]="2"

# A second household device that generates controllable TCP cross traffic.
background[0]="HOME"
background[image]="livestreaming/traffic:local"
background[mem]="256m"
background[cpus]="0.5"
