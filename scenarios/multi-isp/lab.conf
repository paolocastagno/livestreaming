LAB_NAME="adaptive-streaming-multi-isp"
LAB_DESCRIPTION="Live ABR streaming from one content provider and shared CDN edge through two ISPs"
LAB_VERSION="3.0"
LAB_AUTHOR="livestreaming lab"
LAB_WEB="https://www.kathara.org/"

source[0]="CONTRIBUTION"
source[image]="livestreaming/source:local"
source[mem]="1g"
source[cpus]="1"

server[0]="CONTRIBUTION"
server[1]="ORIGIN"
server[image]="livestreaming/server:local"
server[bridged]="true"
server[port]="8080:80/tcp"
server[mem]="2g"
server[cpus]="2"

# One off-net CDN PoP peers with both providers on the shared PEERING LAN.
cdn[0]="ORIGIN"
cdn[1]="PEERING"
cdn[image]="livestreaming/cdn:local"
cdn[bridged]="true"
cdn[port]="8081:80/tcp"
cdn[mem]="1g"
cdn[cpus]="1"

isp[0]="PEERING"
isp[1]="ACCESS"
isp[image]="kathara/core:latest"
isp[privileged]="true"

home[0]="ACCESS"
home[1]="HOME"
home[image]="kathara/core:latest"
home[privileged]="true"

client[0]="HOME"
client[image]="livestreaming/client:local"
client[bridged]="true"
client[port]="6080:6080/tcp"
client[port]="8088:8088/tcp"
client[mem]="2g"
client[cpus]="2"

background[0]="HOME"
background[image]="livestreaming/traffic:local"
background[mem]="256m"
background[cpus]="0.5"

isp2[0]="PEERING"
isp2[1]="ACCESS2"
isp2[image]="kathara/core:latest"
isp2[privileged]="true"

home2[0]="ACCESS2"
home2[1]="HOME2"
home2[image]="kathara/core:latest"
home2[privileged]="true"

client2[0]="HOME2"
client2[image]="livestreaming/client:local"
client2[bridged]="true"
client2[port]="6081:6080/tcp"
client2[port]="8089:8088/tcp"
client2[mem]="2g"
client2[cpus]="2"

background2[0]="HOME2"
background2[image]="livestreaming/traffic:local"
background2[mem]="256m"
background2[cpus]="0.5"
