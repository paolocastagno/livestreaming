LAB_NAME="adaptive-streaming-multi-isp-gpu"
LAB_DESCRIPTION="GPU live ABR streaming through one CDN edge shared by two ISPs"
LAB_VERSION="3.0"
LAB_AUTHOR="livestreaming lab"
LAB_WEB="https://www.kathara.org/"

source[0]="CONTRIBUTION"
source[image]="livestreaming/source-gpu:local"
source[mem]="8g"
source[cpus]="8"
source[cpuset_cpus]="16-23"
source[cpuset_mems]="0"
source[gpus]="0"
source[env]="NVIDIA_VISIBLE_DEVICES=0"
source[env]="NVIDIA_DRIVER_CAPABILITIES=compute,video,utility"

server[0]="CONTRIBUTION"
server[1]="ORIGIN"
server[image]="livestreaming/server:local"
server[bridged]="true"
server[port]="8080:80/tcp"
server[mem]="4g"
server[cpus]="2"
server[cpuset_cpus]="12-15"
server[cpuset_mems]="0"

cdn[0]="ORIGIN"
cdn[1]="PEERING"
cdn[image]="livestreaming/cdn:local"
cdn[bridged]="true"
cdn[port]="8081:80/tcp"
cdn[mem]="2g"
cdn[cpus]="1"
cdn[cpuset_cpus]="8-11"
cdn[cpuset_mems]="0"

isp[0]="PEERING"
isp[1]="ACCESS"
isp[image]="kathara/core:latest"
isp[privileged]="true"
isp[mem]="512m"
isp[cpus]="1"

home[0]="ACCESS"
home[1]="HOME"
home[image]="kathara/core:latest"
home[privileged]="true"
home[mem]="512m"
home[cpus]="1"

client[0]="HOME"
client[image]="livestreaming/client:local"
client[bridged]="true"
client[port]="6080:6080/tcp"
client[port]="8088:8088/tcp"
client[mem]="4g"
client[cpus]="2"

background[0]="HOME"
background[image]="livestreaming/traffic:local"
background[mem]="512m"
background[cpus]="0.5"

isp2[0]="PEERING"
isp2[1]="ACCESS2"
isp2[image]="kathara/core:latest"
isp2[privileged]="true"
isp2[mem]="512m"
isp2[cpus]="1"

home2[0]="ACCESS2"
home2[1]="HOME2"
home2[image]="kathara/core:latest"
home2[privileged]="true"
home2[mem]="512m"
home2[cpus]="1"

client2[0]="HOME2"
client2[image]="livestreaming/client:local"
client2[bridged]="true"
client2[port]="6081:6080/tcp"
client2[port]="8089:8088/tcp"
client2[mem]="4g"
client2[cpus]="2"

background2[0]="HOME2"
background2[image]="livestreaming/traffic:local"
background2[mem]="512m"
background2[cpus]="0.5"
